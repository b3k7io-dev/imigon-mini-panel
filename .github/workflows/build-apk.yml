name: Build Android APK

on:
  push:
    paths:
      - "Apk-Version/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "Apk-Version/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Apk-Version

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minipanel-debug-apk
          path: Apk-Version/app/build/outputs/apk/debug/*.apk
